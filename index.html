<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Swipe Stakes Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: sans-serif; padding: 20px;">

    <div id="setup-screen">
        <h2 style="color: #4a4e69;">Game Setup</h2>
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Subreddits (comma separated)</label>
            <input type="text" id="subreddit-input" placeholder="e.g., luxurycars, movieposters" style="width: 100%; max-width: 400px; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Media Type</label>
            <label><input type="checkbox" id="type-pics" checked> Pictures</label><br>
            <label><input type="checkbox" id="type-gifs" checked> Gifs</label><br>
            <label><input type="checkbox" id="type-vids" checked> Videos</label>
        </div>

        <button id="start-btn" style="padding: 10px 20px; font-size: 16px; background-color: #4a4e69; color: white; border: none; border-radius: 5px; cursor: pointer;">Start Playing</button>
    </div>

    <div id="game-screen" style="display: none;">
        <header id="scoreboard" style="margin-bottom: 20px; font-weight: bold;">
            <div class="stat">Baseline: <span id="baseline-val">10</span></div>
            <div class="stat">Tray Points: <span id="tray-val">0</span></div>
            <button id="cashout-btn" style="margin-top: 10px;">Cash Out</button>
        </header>

        <main id="game-container">
            <div id="card">
                <div id="card-image-placeholder"></div>
                <h2 id="card-title">Card Title</h2>
                <div id="options-container">
                    </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>

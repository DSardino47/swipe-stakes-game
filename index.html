<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Swipe Stakes</title>
</head>
<body style="font-family: sans-serif; background-color: #f0f0f0; margin: 0; padding: 20px;">

    <div id="setup-screen" style="max-width: 400px; margin: 0 auto; margin-top: 20px;">
        <h1 style="color: #333; text-align: center; font-size: 32px; margin-bottom: 5px;">Swipe Stakes</h1>
        <p style="text-align: center; color: #666; margin-top: 0; margin-bottom: 30px;">How long can you survive?</p>
        
        <div style="background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.05);">
            <h3 style="margin-top: 0; color: #2a9d8f; text-align: center;">📸 Load Your Deck</h3>
            <p style="font-size: 14px; color: #666; text-align: center; margin-bottom: 20px;">Select photos and videos from your camera roll. The game will shuffle and loop them endlessly.</p>
            
            <input type="file" id="local-upload" accept="image/*,video/*" multiple style="width: 100%; margin-bottom: 15px; font-size: 14px; padding: 10px; background: #f9f9f9; border-radius: 8px; border: 1px solid #ddd;">
            
            <button id="start-local-btn" style="width: 100%; padding: 18px; font-size: 18px; font-weight: bold; background-color: #2a9d8f; color: white; border: none; border-radius: 12px; cursor: pointer; display: none;">Start Game</button>
        </div>
    </div>

    <div id="game-screen" style="display: none; max-width: 400px; margin: 0 auto;">
        <h1 style="text-align: center; color: #333; font-size: 28px;">Points: <span id="score-val" style="color: #2a9d8f;">10</span></h1>
        
        <div style="background: white; padding: 15px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.08);">
            <div id="media-container" style="background: #000; border-radius: 12px; margin-bottom: 15px; overflow: hidden;"></div> 
            
            <button class="choice-btn" data-cost="0" style="background:#f0f0f0; color: #333; width:100%; padding:18px; margin-bottom:12px; border:none; border-radius:12px; font-weight:bold; font-size: 16px; cursor:pointer;">Skip (0)</button>
            <button class="choice-btn" data-cost="1" style="background:#e3fbec; color: #1e7041; width:100%; padding:18px; margin-bottom:12px; border:none; border-radius:12px; font-weight:bold; font-size: 16px; cursor:pointer;">It's okay (+1)</button>
            <button class="choice-btn" data-cost="-2" style="background:#ffe6e6; color: #cc0000; width:100%; padding:18px; margin-bottom:12px; border:none; border-radius:12px; font-weight:bold; font-size: 16px; cursor:pointer;">I want this (-2)</button>
            <button class="choice-btn" data-cost="-9" style="background:#ffcccc; color: #990000; width:100%; padding:18px; margin-bottom:12px; border:none; border-radius:12px; font-weight:bold; font-size: 16px; cursor:pointer;">This is elite (-9)</button>
        </div>
    </div>

    <script>
        // --- GAME ENGINE ---
        let deck = [];
        let currentIndex = 0;
        let score = 10;

        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const mediaContainer = document.getElementById('media-container');
        const scoreDisplay = document.getElementById('score-val');
        const localUploadInput = document.getElementById('local-upload');
        const startLocalBtn = document.getElementById('start-local-btn');

        // Fisher-Yates Shuffle Function
        function shuffleDeck(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Show start button only when files are selected
        localUploadInput.addEventListener('change', () => {
            if (localUploadInput.files.length > 0) {
                startLocalBtn.style.display = "block";
                startLocalBtn.innerText = `Start Game (${localUploadInput.files.length} items)`;
            } else {
                startLocalBtn.style.display = "none";
            }
        });

        // Load files and start game
        startLocalBtn.addEventListener('click', () => {
            const files = localUploadInput.files;
            deck = [];
            
            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                
                // Better safety check for Apple/mobile video formats
                let isVideo = file.type.startsWith('video') || file.name.match(/\.(mp4|mov|webm|m4v)$/i) != null;
                
                deck.push({
                    url: URL.createObjectURL(file),
                    type: isVideo ? 'video' : 'image'
                });
            }

            shuffleDeck(deck);
            score = 10;
            scoreDisplay.innerText = score;
            currentIndex = 0;
            
            setupScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            renderCard();
        });

        // Render the image or video
        function renderCard() {
            // THE ENDLESS LOOP LOGIC
            if (currentIndex >= deck.length) {
                shuffleDeck(deck); // Reshuffle so the loop feels fresh!
                currentIndex = 0;
            }

            let cardData = deck[currentIndex];
            mediaContainer.innerHTML = "";

            if (cardData.type === 'video') {
                // webkit-playsinline is required for iPhones to prevent forced full-screen
                mediaContainer.innerHTML = `<video src="${cardData.url}" autoplay loop muted playsinline webkit-playsinline style="width: 100%; height: 380px; object-fit: cover; display: block;"></video>`;
            } else {
                mediaContainer.innerHTML = `<img src="${cardData.url}" style="width: 100%; height: 380px; object-fit: cover; display: block;">`;
            }
        }

        // Handle the Math
        document.querySelectorAll('.choice-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                let cost = parseInt(e.target.getAttribute('data-cost'));
                score += cost;
                scoreDisplay.innerText = score;
                
                // Bankruptcy Check
                if (score <= 0) {
                    alert("Bankrupt! You gambled it all and hit zero.");
                    location.reload();
                    return;
                }
                
                currentIndex++;
                renderCard();
            });
        });
    </script>
</body>
</html>

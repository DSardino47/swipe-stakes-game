<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Swipe Stakes Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: sans-serif; padding: 20px;">

   <div id="game-screen" style="display: none;">
        
        <header id="scoreboard" style="margin-bottom: 20px; font-size: 28px; font-weight: bold; text-align: center;">
            <div>Points: <span id="score-val" style="color: #4a4e69;">10</span></div>
        </header>

        <main id="game-container">
            <div id="card">
                <div id="card-image-placeholder"></div>
                <h2 id="card-title" style="text-align: center; font-size: 18px; margin: 10px 0;">Card Title</h2>
                <div id="options-container">
                    </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>

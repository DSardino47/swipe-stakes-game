<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Swipe Stakes Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: sans-serif; padding: 20px;">

  <div id="setup-screen" style="max-width: 400px; margin: 0 auto;">
        <h2 style="color: #4a4e69; text-align: center;">Choose Your Deck</h2>
        
        <div style="background: #f4f4f9; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #ddd;">
            <h3 style="margin-top: 0; color: #4a4e69;">🌐 Play a Subreddit</h3>
            <p style="font-size: 14px; color: #666; margin-bottom: 10px;">Fetches the Top 50 posts of the month.</p>
            <input type="text" id="subreddit-input" placeholder="e.g., luxurycars" style="width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px;">
            <button id="start-reddit-btn" style="width: 100%; padding: 15px; font-size: 16px; font-weight: bold; background-color: #4a4e69; color: white; border: none; border-radius: 8px; cursor: pointer;">Fetch Reddit</button>
        </div>

        <div style="background: #f4f4f9; padding: 20px; border-radius: 12px; border: 1px solid #ddd;">
            <h3 style="margin-top: 0; color: #2a9d8f;">📸 Play Your Camera Roll</h3>
            <p style="font-size: 14px; color: #666; margin-bottom: 10px;">Select up to 100 photos directly from your device.</p>
            
            <input type="file" id="local-upload" accept="image/*" multiple style="width: 100%; margin-bottom: 10px; font-size: 14px; padding: 10px; background: #fff; border-radius: 5px;">
            
            <p id="file-count-display" style="font-weight: bold; color: #2a9d8f; text-align: center; margin-bottom: 10px; display: none;">0 photos ready!</p>
            
            <button id="start-local-btn" style="width: 100%; padding: 15px; font-size: 16px; font-weight: bold; background-color: #2a9d8f; color: white; border: none; border-radius: 8px; cursor: pointer; opacity: 0.5;">Select Photos First</button>
        </div>
    </div>

    
    <script src="app.js"></script>
</body>
</html>
